[package]
name = "tessivum"
version = "0.1.0"
edition = "2021"

[dependencies]
tessivum-core = { git = "https://github.com/wavetao2010/tessivum-core.git", rev = "2d3fd3c418d8ce28c4ca7a8180f6794963271db7" }
tessivum-extism = { git = "https://github.com/wavetao2010/tessivum-core.git", rev = "2d3fd3c418d8ce28c4ca7a8180f6794963271db7" }
tessivum-node-bridge = { git = "https://github.com/wavetao2010/tessivum-core.git", rev = "2d3fd3c418d8ce28c4ca7a8180f6794963271db7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
zstd = "0.13"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_yaml = "0.9"
sha2 = "0.10"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
url = "2"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "tokio", "ws"] }
bytes = "1"
http-body-util = "0.1"
mime_guess = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
