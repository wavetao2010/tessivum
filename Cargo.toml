[package]
name = "tessivum"
version = "0.1.0-alpha.23"
edition = "2021"
description = "Independent Rust-native agent harness inspired by DeepSeek Harness and Cordis"
repository = "https://github.com/wavetao2010/tessivum"
readme = "README.md"
license = "MIT"
publish = false
default-run = "tessivum"
build = "build.rs"

[dependencies]
tessivum-core = { git = "https://github.com/wavetao2010/tessivum-core.git", rev = "640e9ea41810861eebd5bbf300052072e989259c", version = "=0.1.6" }
tessivum-extism = { git = "https://github.com/wavetao2010/tessivum-core.git", rev = "640e9ea41810861eebd5bbf300052072e989259c", version = "=0.1.6" }
tessivum-node-bridge = { git = "https://github.com/wavetao2010/tessivum-core.git", rev = "640e9ea41810861eebd5bbf300052072e989259c", version = "=0.1.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
zstd = "0.13"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_yaml = "0.9"
sha2 = "0.10"
sha1 = "0.10"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
url = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "tokio", "ws"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
