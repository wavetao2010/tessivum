- dialog "设置":
  - navigation:
    - text: 设置
    - button "通用设置":
      - img
      - text: 通用设置
    - button "模型":
      - img
      - text: 模型
    - button "插件":
      - img
      - text: 插件
    - button "Agent 模式":
      - img
      - text: Agent 模式
  - button "打开配置文件"
  - button "远程访问"
  - button "关闭":
    - img
    - text: 关闭
  - heading "Agent 模式" [level=2]
  - paragraph: Agent 模式定义一个会话的提示词、工具与能力。复制既有模式，即可创建可编辑的 mode.toml。
  - heading "内置" [level=3]
  - list:
    - listitem:
      - 'button "当前使用: 标准模式" [disabled] [pressed]':
        - text: 标准模式 内置 当前使用 提供完整的 Tessivum 原生工具集。
        - code: standard
      - 'button "查看: 标准模式"':
        - img
        - text: 查看
      - 'button "复制: 标准模式"':
        - img
        - text: 复制
    - listitem:
      - 'button "设为默认: PTC 模式"':
        - text: PTC 模式 内置 由 Bun 驱动的程序化工具调用方式。
        - code: ptc
      - 'button "查看: PTC 模式"':
        - img
        - text: 查看
      - 'button "复制: PTC 模式"':
        - img
        - text: 复制
    - listitem:
      - 'button "设为默认: 极简模式"':
        - text: 极简模式 内置 专注于持久 Shell 编辑的精简模式。
        - code: minimal
      - 'button "查看: 极简模式"':
        - img
        - text: 查看
      - 'button "复制: 极简模式"':
        - img
        - text: 复制
    - listitem:
      - 'button "设为默认: 组装模式"':
        - text: 组装模式 内置 用于构建 Native、WASM 或 Legacy 条目组合的原生模式。
        - code: composition
      - 'button "查看: 组装模式"':
        - img
        - text: 查看
      - 'button "复制: 组装模式"':
        - img
        - text: 复制
  - heading "自定义" [level=3]
