name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TESSIVUM_DEEPSEEK_VENDOR: ${{ github.workspace }}/.ci/deepseek-harness/vendor

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .ci/deepseek-harness

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Fetch Rust dependencies
        run: cargo fetch --locked


      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Browser shell
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run Rust tests
        run: cargo test --all-targets

  wasm-fixture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/wasm/rust-minimal
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fixtures/wasm/rust-minimal
      - name: Rebuild pinned Rust WASM guest
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Verify checked guest artifact
        run: |
          cmp plugin.wasm target/wasm32-unknown-unknown/release/tessivum_rust_minimal.wasm
          sha256sum -c plugin.wasm.sha256
