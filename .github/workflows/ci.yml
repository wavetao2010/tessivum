name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TESSIVUM_DEEPSEEK_VENDOR: ${{ github.workspace }}/.ci/deepseek-harness/vendor
  TESSIVUM_DEEPSEEK_SOURCE: ${{ github.workspace }}/.ci/deepseek-harness
  TESSIVUM_CORDIS_SOURCE: ${{ github.workspace }}/.ci/cordis
  TESSIVUM_CORE_SOURCE: ${{ github.workspace }}/.ci/tessivum-core

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .ci/deepseek-harness
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cordiverse/cordis
          ref: 8cc9e33fab69e2d0476d126baaf2acb24e6a6ab4
          path: .ci/cordis
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wavetao2010/tessivum-core
          ref: 1dce6fbda364c98a964d4875ef86d897ea322ca1
          path: .ci/tessivum-core

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Verify compatibility baseline
        run: python3 scripts/check_compat_baseline.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Install pinned DeepSeek build dependencies
        working-directory: .ci/deepseek-harness
        run: npm exec --yes pnpm@11.7.0 -- install --frozen-lockfile

      - name: Build Browser shell
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Run pinned client regression suite
        working-directory: web
        run: bun run test:source-client

      - name: Rebuild pinned Rust WASM guest
        working-directory: fixtures/wasm/rust-minimal
        run: cargo build --locked --release --target wasm32-unknown-unknown

      - name: Verify checked guest artifact hash
        working-directory: fixtures/wasm/rust-minimal
        run: sha256sum -c plugin.wasm.sha256

      - name: Exercise rebuilt guest contract
        env:
          TESSIVUM_WASM_GUEST: ${{ github.workspace }}/fixtures/wasm/rust-minimal/target/wasm32-unknown-unknown/release/tessivum_rust_minimal.wasm
        run: cargo test --locked --test wasm_plugins real_guest_denies_undeclared_service_and_traps_deterministically -- --exact


  browser-e2e:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TESSIVUM_DEEPSEEK_VENDOR: ${{ github.workspace }}/.ci/deepseek-harness/vendor
      TESSIVUM_DEEPSEEK_SOURCE: ${{ github.workspace }}/.ci/deepseek-harness
      TESSIVUM_CORDIS_SOURCE: ${{ github.workspace }}/.ci/cordis
      TESSIVUM_CORE_SOURCE: ${{ github.workspace }}/.ci/tessivum-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .ci/deepseek-harness
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cordiverse/cordis
          ref: 8cc9e33fab69e2d0476d126baaf2acb24e6a6ab4
          path: .ci/cordis
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wavetao2010/tessivum-core
          ref: 1dce6fbda364c98a964d4875ef86d897ea322ca1
          path: .ci/tessivum-core

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install pinned DeepSeek build dependencies
        working-directory: .ci/deepseek-harness
        run: npm exec --yes pnpm@11.7.0 -- install --frozen-lockfile

      - name: Build Browser shell
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build native Web host
        run: cargo build --bin tessivum

      - name: Run all 69 Browser compatibility scenarios
        working-directory: web
        run: bun test ./tests/migrated.test.ts --max-concurrency 1 --timeout 1200000
