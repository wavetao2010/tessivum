name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TESSIVUM_DEEPSEEK_VENDOR: ${{ github.workspace }}/.ci/deepseek-harness/vendor
  TESSIVUM_DEEPSEEK_SOURCE: ${{ github.workspace }}/.ci/deepseek-harness
  TESSIVUM_CORDIS_SOURCE: ${{ github.workspace }}/.ci/cordis
  TESSIVUM_CORE_SOURCE: ${{ github.workspace }}/.ci/tessivum-core
  TESSIVUM_COMPAT_HOST: ${{ github.workspace }}/.ci/tessivum-core/node/compat-host/src/index.ts
  CORDIS_VENDOR_ROOT: ${{ github.workspace }}/.ci/deepseek-harness/vendor

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .ci/deepseek-harness
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cordiverse/cordis
          ref: 8cc9e33fab69e2d0476d126baaf2acb24e6a6ab4
          path: .ci/cordis
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wavetao2010/tessivum-core
          ref: 640e9ea41810861eebd5bbf300052072e989259c
          path: .ci/tessivum-core

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Verify compatibility baseline
        run: python3 scripts/check_compat_baseline.py

      - name: Verify plugin compatibility ledger
        run: python3 scripts/check_plugin_verification.py

      - name: Verify release benchmark facts
        run: python3 scripts/check_release_facts.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Install pinned DeepSeek build dependencies
        working-directory: .ci/deepseek-harness
        run: npm exec --yes pnpm@11.7.0 -- install --frozen-lockfile

      - name: Build Browser shell
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Verify first-party market
        working-directory: plugins/market
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Run pinned client regression suite
        working-directory: web
        run: bun run test:source-client

      - name: Rebuild pinned Rust WASM guest
        working-directory: fixtures/wasm/rust-minimal
        run: cargo build --locked --release --target wasm32-unknown-unknown

      - name: Verify checked guest artifact hash
        working-directory: fixtures/wasm/rust-minimal
        run: sha256sum -c plugin.wasm.sha256

      - name: Exercise rebuilt guest contract
        env:
          TESSIVUM_WASM_GUEST: ${{ github.workspace }}/fixtures/wasm/rust-minimal/target/wasm32-unknown-unknown/release/tessivum_rust_minimal.wasm
        run: cargo test --locked --test wasm_plugins real_guest_denies_undeclared_service_and_traps_deterministically -- --exact


  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .ci/deepseek-harness
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cordiverse/cordis
          ref: 8cc9e33fab69e2d0476d126baaf2acb24e6a6ab4
          path: .ci/cordis
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wavetao2010/tessivum-core
          ref: 640e9ea41810861eebd5bbf300052072e989259c
          path: .ci/tessivum-core

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: Verify compatibility baselines
        run: |
          python scripts/check_compat_baseline.py
          python scripts/check_plugin_verification.py
          python scripts/check_release_facts.py

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Install pinned DeepSeek build dependencies
        working-directory: .ci/deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Build Browser shell
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Verify first-party market
        working-directory: plugins/market
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test

      - name: Check Windows product
        run: cargo check --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests and Legacy bridge smokes
        run: cargo test --all-targets --locked

      - name: Run pinned client regression suite
        working-directory: web
        run: bun run test:source-client

      - name: Rebuild pinned Rust WASM guest
        working-directory: fixtures/wasm/rust-minimal
        run: cargo build --locked --release --target wasm32-unknown-unknown

      - name: Verify checked guest artifact hash
        working-directory: fixtures/wasm/rust-minimal
        run: |
          $expected = (Get-Content plugin.wasm.sha256).Split()[0]
          $actual = (Get-FileHash target/wasm32-unknown-unknown/release/tessivum_rust_minimal.wasm -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "WASM guest checksum mismatch: $actual" }

      - name: Exercise rebuilt guest contract
        env:
          TESSIVUM_WASM_GUEST: ${{ github.workspace }}/fixtures/wasm/rust-minimal/target/wasm32-unknown-unknown/release/tessivum_rust_minimal.wasm
        run: cargo test --locked --test wasm_plugins real_guest_denies_undeclared_service_and_traps_deterministically -- --exact

      - name: Exercise real Legacy Node lifecycle
        run: cargo test --locked --test community_plugins vendored_timer_loads_unchanged_through_the_legacy_profile_and_reaps_after_disconnect -- --exact

  browser-e2e:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TESSIVUM_DEEPSEEK_VENDOR: ${{ github.workspace }}/.ci/deepseek-harness/vendor
      TESSIVUM_DEEPSEEK_SOURCE: ${{ github.workspace }}/.ci/deepseek-harness
      TESSIVUM_CORDIS_SOURCE: ${{ github.workspace }}/.ci/cordis
      TESSIVUM_CORE_SOURCE: ${{ github.workspace }}/.ci/tessivum-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .ci/deepseek-harness
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cordiverse/cordis
          ref: 8cc9e33fab69e2d0476d126baaf2acb24e6a6ab4
          path: .ci/cordis
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wavetao2010/tessivum-core
          ref: 640e9ea41810861eebd5bbf300052072e989259c
          path: .ci/tessivum-core

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: Install pinned DeepSeek build dependencies
        working-directory: .ci/deepseek-harness
        run: npm exec --yes pnpm@11.7.0 -- install --frozen-lockfile

      - name: Install first-party market dependencies
        working-directory: plugins/market
        run: bun install --frozen-lockfile

      - name: Build Browser shell
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build native Web host
        run: cargo build --bin tessivum

      - name: Run Browser compatibility scenarios
        working-directory: web
        run: bun test ./tests/migrated.test.ts --timeout 3600000
