name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Tessivum release tag
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  web:
    name: Build Browser assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .release/deepseek-harness

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
      - name: Install pinned DeepSeek build dependencies
        working-directory: .release/deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Build pinned Cordis runtime
        working-directory: .release/deepseek-harness
        run: |
          pnpm run build:lib:host
          tar -czf "$GITHUB_WORKSPACE/cordis-runtime.tar.gz" \
            vendor/cordis/lib vendor/cosmokit/lib vendor/loader/lib

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cordis-runtime
          path: cordis-runtime.tar.gz
          if-no-files-found: error


      - name: Fetch verified Host-only modules
        run: python3 scripts/fetch_host_modules.py packaging/host-modules.json .release/host-modules

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: host-modules
          path: .release/host-modules
          if-no-files-found: error

      - name: Build Browser bundle
        working-directory: web
        env:
          CORDIS_VENDOR_ROOT: ${{ github.workspace }}/.release/deepseek-harness/vendor
          TESSIVUM_DEEPSEEK_SOURCE: ${{ github.workspace }}/.release/deepseek-harness
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-assets
          path: |
            web/dist
            web/client-packages
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wavetao2010/tessivum-core
          ref: 37dcaa5520d3b36a7b117650164406bc813e3046
          path: .release/tessivum-core

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .release/deepseek-harness
          sparse-checkout: vendor

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-assets
          path: web

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: cordis-runtime
          path: .release


      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: host-modules
          path: .release/host-modules
      - name: Restore compiled Cordis runtime
        run: tar -xzf .release/cordis-runtime.tar.gz -C .release/deepseek-harness

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release executable
        env:
          CORDIS_VENDOR_ROOT: ${{ github.workspace }}/.release/deepseek-harness/vendor
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          scripts/package_release.sh \
            "$RELEASE_TAG" \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/tessivum" \
            ".release/tessivum-core/node/compat-host" \
            ".release/host-modules" \
            ".release/deepseek-harness/vendor" \
            dist
          archive="dist/tessivum-${RELEASE_TAG#v}-${{ matrix.target }}.tar.gz"
          mkdir smoke
          tar -xzf "$archive" -C smoke
          archive_root="smoke/tessivum-${RELEASE_TAG#v}-${{ matrix.target }}"
          launcher="$archive_root/bin/tessivum"
          "$launcher" --version
          if tar -tzf "$archive" | grep -E '(^|/)(\.agent-presets|agent-presets)(/|$)|/(agent\.cordis\.yml|preset\.yml)$'; then
            echo "archive contains legacy Agent Preset assets" >&2
            exit 1
          fi
          if grep -q 'TESSIVUM_AGENT_PRESET_ROOT' "$launcher"; then
            echo "launcher exports a legacy Agent Preset root" >&2
            exit 1
          fi
          wait_for_web() {
            local port=$1 log=$2
            for _ in {1..100}; do
              curl -fsS "http://127.0.0.1:$port/" >/dev/null && return
              sleep 0.1
            done
            cat "$log"
            return 1
          }
          native_mode_read() {
            local port=$1 mode=$2
            curl -fsS \
              -H 'content-type: application/json' \
              -d "{\"type\":\"client-request\",\"rpcId\":\"release-mode-$mode\",\"method\":\"agentPreset.read\",\"payload\":{\"agentPreset\":\"$mode\"}}" \
              "http://127.0.0.1:$port/api/agentPreset.read"
          }
          ptc_path="$PWD/smoke-ptc-path"
          mkdir "$ptc_path"
          for command in bun sh dirname readlink; do
            command_path=$(command -v "$command")
            ln -s "$command_path" "$ptc_path/$command"
          done
          if PATH="$ptc_path" command -v node >/dev/null; then
            echo "PTC smoke PATH unexpectedly exposes system Node" >&2
            exit 1
          fi
          PATH="$ptc_path" bun --version
          ptc_log="$PWD/smoke-ptc-web.log"
          PATH="$ptc_path" TESSIVUM_WEB_ADDR=127.0.0.1:38079 \
            "$launcher" --data-dir "$PWD/smoke-ptc-state" web >"$ptc_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          wait_for_web 38079 "$ptc_log"
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-ptc-session","method":"session.create","payload":{"sessionId":"release-ptc-session"}}' \
            http://127.0.0.1:38079/api/session.create \
            | jq -e '.result.ok == true and .result.value.sessionId == "release-ptc-session"'
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-ptc-select","method":"agentPreset.select","payload":{"sessionId":"release-ptc-session","agentPreset":"ptc"}}' \
            http://127.0.0.1:38079/api/agentPreset.select \
            | jq -e '.result.ok == true and .result.value == {"agentPreset":"ptc"}'
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-native-roster","method":"agentPreset.list","payload":{}}' \
            http://127.0.0.1:38079/api/agentPreset.list \
            | jq -e '.result.ok == true and (.result.value.presets | map(.id)) == ["standard", "ptc", "minimal", "composition"]'
          for mode in standard ptc minimal composition; do
            mode_json="$(native_mode_read 38079 "$mode")"
            jq -e --arg mode "$mode" '
              .result.ok == true
              and .result.value.agentPreset == $mode
              and (.result.value.content | type == "string")
              and (.result.value.content | test("(?m)^schema = 1$"))
              and (.result.value.content | test("(?m)^id = \\\"" + $mode + "\\\"$"))
            ' <<<"$mode_json"
            jq -r '.result.value.content' <<<"$mode_json" >"$PWD/smoke-$mode.mode.toml"
            mode_hash=$(shasum -a 256 "$PWD/smoke-$mode.mode.toml" | awk '{print $1}')
            [[ $mode_hash =~ ^[0-9a-f]{64}$ ]]
            printf '%s schema=1 sha256=%s\n' "$mode" "$mode_hash"
          done
          native_mode_read 38079 ptc | jq -e '.result.value.content | test("(?m)^presentation = \\\"programmatic\\\"$") and test("(?m)^bun = true$")'
          native_mode_read 38079 minimal | jq -e '.result.value.content | test("(?m)^persistent-shell = true$")'
          native_mode_read 38079 composition | jq -e '.result.value.content | test("(?m)^composition = true$")'
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-user-mode-copy","method":"agentPreset.copy","payload":{"from":"standard","agentPreset":"release-native-mode","name":"Release Native Mode"}}' \
            http://127.0.0.1:38079/api/agentPreset.copy \
            | jq -e '.result.ok == true and .result.value == {"agentPreset":"release-native-mode"}'
          user_mode="$PWD/smoke-ptc-state/modes/release-native-mode/mode.toml"
          test -f "$user_mode"
          grep -qx 'schema = 1' "$user_mode"
          grep -qx 'id = "release-native-mode"' "$user_mode"
          test ! -e "$PWD/smoke-ptc-state/.agent-presets"
          kill "$server_pid"
          wait "$server_pid"
          trap - EXIT
          "$launcher" --data-dir "$PWD/smoke-state" plugin add "file:$PWD/fixtures/community/timer"
          log="$PWD/smoke-web.log"
          TESSIVUM_WEB_ADDR=127.0.0.1:38080 \
            "$launcher" --data-dir "$PWD/smoke-state" web >"$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          wait_for_web 38080 "$log"
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-plugin-smoke","method":"pluginInventory/list","payload":{"args":[]}}' \
            http://127.0.0.1:38080/api/pluginInventory/list \
            | jq -e '.result.ok == true and any(.result.value.entries[]; .moduleName == "@cordisjs/plugin-timer" and .enabled == true and .fiberPhase == "active")'
          kill "$server_pid"
          wait "$server_pid"
          trap - EXIT

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tessivum-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: tessivum-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: |
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Run installer and Formula fixture checks
        run: |
          sh scripts/test_install.sh
          python3 scripts/test_homebrew_formula.py

      - name: Generate and validate Homebrew Formula against local release archives
        run: python3 scripts/generate_homebrew_formula.py "$RELEASE_TAG" dist dist/tessivum.rb

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --title "Tessivum ${RELEASE_TAG#v}" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 dist/tessivum.rb --clobber
