name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Tessivum release tag
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  web:
    name: Build Browser assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .release/deepseek-harness

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
      - name: Install pinned DeepSeek build dependencies
        working-directory: .release/deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Build pinned Cordis runtime
        working-directory: .release/deepseek-harness
        run: |
          pnpm run build:lib:host
          tar -czf "$GITHUB_WORKSPACE/cordis-runtime.tar.gz" \
            vendor/cordis/lib vendor/cosmokit/lib vendor/loader/lib

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cordis-runtime
          path: cordis-runtime.tar.gz
          if-no-files-found: error


      - name: Fetch verified Host-only modules
        run: python3 scripts/fetch_host_modules.py packaging/host-modules.json .release/host-modules

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: host-modules
          path: .release/host-modules
          if-no-files-found: error

      - name: Build Browser bundle
        working-directory: web
        env:
          CORDIS_VENDOR_ROOT: ${{ github.workspace }}/.release/deepseek-harness/vendor
          TESSIVUM_DEEPSEEK_SOURCE: ${{ github.workspace }}/.release/deepseek-harness
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-assets
          path: |
            web/dist
            web/client-packages
          if-no-files-found: error

  market:
    name: Build first-party market
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install, check, and pack first-party market
        working-directory: plugins/market
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
          mkdir -p "$GITHUB_WORKSPACE/.release/market"
          bun pm pack --ignore-scripts --destination "$GITHUB_WORKSPACE/.release/market"
          market_tgz="$GITHUB_WORKSPACE/.release/market/tessivum-market-${RELEASE_TAG#v}.tgz"
          test -f "$market_tgz"
          (
            cd "$(dirname "$market_tgz")"
            shasum -a 256 "$(basename "$market_tgz")" > "$(basename "$market_tgz").sha256"
          )
          cp "$GITHUB_WORKSPACE/packaging/market-source.json" "$market_tgz.source.json"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tessivum-market
          path: .release/market
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [web, market]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wavetao2010/tessivum-core
          ref: 2a7f39006f7bde5b680405b2827f32d85ab20c26
          path: .release/tessivum-core

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .release/deepseek-harness
          sparse-checkout: vendor

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-assets
          path: web

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: cordis-runtime
          path: .release


      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: tessivum-market
          path: .release/market

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: host-modules
          path: .release/host-modules
      - name: Restore compiled Cordis runtime
        run: tar -xzf .release/cordis-runtime.tar.gz -C .release/deepseek-harness

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release executable
        env:
          CORDIS_VENDOR_ROOT: ${{ github.workspace }}/.release/deepseek-harness/vendor
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          scripts/package_release.sh \
            "$RELEASE_TAG" \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/tessivum" \
            ".release/tessivum-core/node/compat-host" \
            ".release/host-modules" \
            ".release/deepseek-harness/vendor" \
            ".release/market/tessivum-market-${RELEASE_TAG#v}.tgz" \
            dist
          archive="dist/tessivum-${RELEASE_TAG#v}-${{ matrix.target }}.tar.gz"
          mkdir smoke
          tar -xzf "$archive" -C smoke
          archive_root="smoke/tessivum-${RELEASE_TAG#v}-${{ matrix.target }}"
          launcher="$archive_root/bin/tessivum"
          "$launcher" --version
          market_tgz="$archive_root/share/tessivum/plugins/tessivum-market-${RELEASE_TAG#v}.tgz"
          market_checksum="$market_tgz.sha256"
          market_source="$market_tgz.source.json"
          market_license="$archive_root/share/licenses/tessivum-market-${RELEASE_TAG#v}/LICENSE"
          test -f "$market_tgz"
          test -f "$market_checksum"
          test -f "$market_source"
          test -f "$market_license"
          (
            cd "$(dirname "$market_tgz")"
            if command -v sha256sum >/dev/null; then
              sha256sum -c "$(basename "$market_checksum")"
            else
              shasum -a 256 -c "$(basename "$market_checksum")"
            fi
          )
          market_provenance="$(jq -ce --arg version "${RELEASE_TAG#v}" '
            if . == {
              "format": 1,
              "package": {"name": "tessivum-market", "version": $version, "license": "MIT"},
              "upstream": {
                "repository": "https://github.com/dsh-market/dsh-market",
                "version": "1.38.1",
                "commit": "df2a16b1ed2dfaf1f2505e184e738c0d6d428945",
                "tarballIntegrity": "sha512-Z9VleLtCXwk5OlbSJKayWtbMaKACL8JUMyb/JHpErS4N3q//GJS+cgOhhxNkZYmXxB8/lv9IbhX1CBzlMhJeJg==",
                "license": "MIT"
              }
            } then .upstream else error("invalid market source inventory") end
          ' "$market_source")"
          tar -xOzf "$market_tgz" package/package.json | jq -e --arg version "${RELEASE_TAG#v}" --argjson provenance "$market_provenance" '
            .name == "tessivum-market"
            and .version == $version
            and .license == "MIT"
            and .tessivum.provenance == $provenance
          '
          tar -xOzf "$market_tgz" package/UPSTREAM.json | jq -e --argjson provenance "$market_provenance" '. == $provenance'
          tar -xOzf "$market_tgz" package/LICENSE.upstream | cmp -s - "$market_license"
          if tar -tzf "$archive" | grep -E '(^|/)(\.agent-presets|agent-presets)(/|$)|/(agent\.cordis\.yml|preset\.yml)$'; then
            echo "archive contains legacy Agent Preset assets" >&2
            exit 1
          fi
          if grep -q 'TESSIVUM_AGENT_PRESET_ROOT' "$launcher"; then
            echo "launcher exports a legacy Agent Preset root" >&2
            exit 1
          fi
          wait_for_web() {
            local port=$1 log=$2
            for _ in {1..100}; do
              curl -fsS "http://127.0.0.1:$port/" >/dev/null && return
              sleep 0.1
            done
            cat "$log"
            return 1
          }
          native_mode_read() {
            local port=$1 mode=$2
            curl -fsS \
              -H 'content-type: application/json' \
              -d "{\"type\":\"client-request\",\"rpcId\":\"release-mode-$mode\",\"method\":\"agentPreset.read\",\"payload\":{\"agentPreset\":\"$mode\"}}" \
              "http://127.0.0.1:$port/api/agentPreset.read"
          }
          stop_web() {
            local pid=$1 log=$2
            kill -TERM "$pid"
            for _ in {1..150}; do
              if ! kill -0 "$pid" 2>/dev/null; then
                if ! wait "$pid" || grep -Eq 'shutdown exceeded|SHUTDOWN_FAILED' "$log"; then
                  cat "$log"
                  return 1
                fi
                return
              fi
              sleep 0.1
            done
            cat "$log"
            return 1
          }
          ptc_path="$PWD/smoke-ptc-path"
          mkdir "$ptc_path"
          for command in bun sh dirname readlink; do
            command_path=$(command -v "$command")
            ln -s "$command_path" "$ptc_path/$command"
          done
          if PATH="$ptc_path" command -v node >/dev/null; then
            echo "PTC smoke PATH unexpectedly exposes system Node" >&2
            exit 1
          fi
          PATH="$ptc_path" bun --version
          ptc_log="$PWD/smoke-ptc-web.log"
          PATH="$ptc_path" TESSIVUM_WEB_ADDR=127.0.0.1:38079 \
            "$archive_root/libexec/tessivum" --data-dir "$PWD/smoke-ptc-state" web >"$ptc_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          wait_for_web 38079 "$ptc_log"
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-ptc-session","method":"session.create","payload":{"sessionId":"release-ptc-session"}}' \
            http://127.0.0.1:38079/api/session.create \
            | jq -e '.result.ok == true and .result.value.sessionId == "release-ptc-session"'
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-ptc-select","method":"agentPreset.select","payload":{"sessionId":"release-ptc-session","agentPreset":"ptc"}}' \
            http://127.0.0.1:38079/api/agentPreset.select \
            | jq -e '.result.ok == true and .result.value == {"agentPreset":"ptc"}'
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-native-roster","method":"agentPreset.list","payload":{}}' \
            http://127.0.0.1:38079/api/agentPreset.list \
            | jq -e '.result.ok == true and (.result.value.presets | map(.id)) == ["standard", "ptc", "minimal", "composition"]'
          for mode in standard ptc minimal composition; do
            mode_json="$(native_mode_read 38079 "$mode")"
            jq -e --arg mode "$mode" '
              .result.ok == true
              and .result.value.agentPreset == $mode
              and (.result.value.content | type == "string")
              and (.result.value.content | test("(?m)^schema = 1$"))
              and (.result.value.content | test("(?m)^id = \\\"" + $mode + "\\\"$"))
            ' <<<"$mode_json"
            jq -r '.result.value.content' <<<"$mode_json" >"$PWD/smoke-$mode.mode.toml"
            mode_hash=$(shasum -a 256 "$PWD/smoke-$mode.mode.toml" | awk '{print $1}')
            [[ $mode_hash =~ ^[0-9a-f]{64}$ ]]
            printf '%s schema=1 sha256=%s\n' "$mode" "$mode_hash"
          done
          native_mode_read 38079 ptc | jq -e '.result.value.content | test("(?m)^presentation = \\\"programmatic\\\"$") and test("(?m)^bun = true$")'
          native_mode_read 38079 minimal | jq -e '.result.value.content | test("(?m)^persistent-shell = true$")'
          native_mode_read 38079 composition | jq -e '.result.value.content | test("(?m)^composition = true$")'
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-user-mode-copy","method":"agentPreset.copy","payload":{"from":"standard","agentPreset":"release-native-mode","name":"Release Native Mode"}}' \
            http://127.0.0.1:38079/api/agentPreset.copy \
            | jq -e '.result.ok == true and .result.value == {"agentPreset":"release-native-mode"}'
          user_mode="$PWD/smoke-ptc-state/modes/release-native-mode/mode.toml"
          test -f "$user_mode"
          grep -qx 'schema = 1' "$user_mode"
          grep -qx 'id = "release-native-mode"' "$user_mode"
          test ! -e "$PWD/smoke-ptc-state/.agent-presets"
          kill "$server_pid"
          wait "$server_pid"
          trap - EXIT
          dream_state="$PWD/smoke-dream-skin-state"
          "$launcher" --data-dir "$dream_state" plugin add dsh-dream-skin@8.30.1
          jq -e '.dependencies["dsh-dream-skin"] == "8.30.1" and (.dsh.profile.bundles | index("dsh-dream-skin") != null)' "$dream_state/plugins/package.json"
          dream_port=38081
          dream_log="$PWD/smoke-dream-skin-web.log"
          DSH_HOME="$dream_state" TESSIVUM_WEB_ADDR=127.0.0.1:$dream_port \
            "$launcher" --data-dir "$dream_state" web >"$dream_log" 2>&1 &
          dream_pid=$!
          trap 'kill "$dream_pid" 2>/dev/null || true' EXIT
          wait_for_web "$dream_port" "$dream_log"
          dream_bundle_url="$(
          curl -fsS "http://127.0.0.1:$dream_port/" | python3 -c '
          import json
          import re
          import sys

          match = re.search(r"window\.__DSH_BOOT__=(\{.*?\});</script>", sys.stdin.read(), re.S)
          if match is None:
              raise SystemExit("dream-skin smoke: missing browser boot graph")
          entries = json.loads(match.group(1)).get("entries", [])
          for entry in entries:
              if entry.get("id") == "dsh-dream-skin":
                  url = entry.get("url")
                  if isinstance(url, str) and url.startswith("/plugins/dsh-dream-skin/client.js?rev="):
                      print(url)
                      break
          else:
              raise SystemExit("dream-skin smoke: browser bundle is absent from boot graph")
          '
          )"
          curl -fsS "http://127.0.0.1:$dream_port$dream_bundle_url" -o "$PWD/smoke-dream-skin-client.js"
          grep -Fq 'dsh-dream-skin' "$PWD/smoke-dream-skin-client.js"
          dream_response="$(curl --connect-timeout 1 --max-time 2 -fsS \
            -H 'content-type: application/json' \
            -H "origin: http://127.0.0.1:$dream_port" \
            -H 'sec-fetch-site: same-origin' \
            -d '{"method":"set","patch":{"skin":"abyss"}}' \
            "http://127.0.0.1:$dream_port/dream-skin/api")"
          jq -e '.ok == true' <<<"$dream_response"
          dream_response="$(curl --connect-timeout 1 --max-time 2 -fsS \
            -H 'content-type: application/json' \
            -H "origin: http://127.0.0.1:$dream_port" \
            -H 'sec-fetch-site: same-origin' \
            -d '{"method":"get"}' \
            "http://127.0.0.1:$dream_port/dream-skin/api")"
          jq -e '.ok == true and .value.skin == "abyss"' <<<"$dream_response"
          stop_web "$dream_pid" "$dream_log"
          trap - EXIT
          dream_log="$PWD/smoke-dream-skin-restart.log"
          DSH_HOME="$dream_state" TESSIVUM_WEB_ADDR=127.0.0.1:$dream_port \
            "$launcher" --data-dir "$dream_state" web >"$dream_log" 2>&1 &
          dream_pid=$!
          trap 'kill "$dream_pid" 2>/dev/null || true' EXIT
          wait_for_web "$dream_port" "$dream_log"
          dream_response="$(curl --connect-timeout 1 --max-time 2 -fsS \
            -H 'content-type: application/json' \
            -H "origin: http://127.0.0.1:$dream_port" \
            -H 'sec-fetch-site: same-origin' \
            -d '{"method":"get"}' \
            "http://127.0.0.1:$dream_port/dream-skin/api")"
          jq -e '.ok == true and .value.skin == "abyss"' <<<"$dream_response"
          stop_web "$dream_pid" "$dream_log"
          trap - EXIT
          "$launcher" --data-dir "$PWD/smoke-state" plugin add "file:$PWD/fixtures/release/timer-bundle"
          log="$PWD/smoke-web.log"
          TESSIVUM_WEB_ADDR=127.0.0.1:38080 \
            "$launcher" --data-dir "$PWD/smoke-state" web >"$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          wait_for_web 38080 "$log"
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-plugin-smoke","method":"pluginInventory/list","payload":{"args":[]}}' \
            http://127.0.0.1:38080/api/pluginInventory/list \
            | jq -e '.result.ok == true and any(.result.value.entries[]; .moduleName == "@tessivum/release-timer-bundle" and .enabled == true and .fiberPhase == "active")'
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"requestId":"release-shutdown-smoke","args":{}}' \
            http://127.0.0.1:38080/api/host/shutdown \
            | jq -e '.ok == true'
          kill "$server_pid"
          wait "$server_pid"
          trap - EXIT

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tessivum-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: tessivum-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: |
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Run installer and Formula fixture checks
        run: |
          sh scripts/test_install.sh
          python3 scripts/test_homebrew_formula.py

      - name: Generate and validate Homebrew Formula against local release archives
        run: python3 scripts/generate_homebrew_formula.py "$RELEASE_TAG" dist dist/tessivum.rb

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --title "Tessivum ${RELEASE_TAG#v}" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.tgz dist/*.sha256 dist/*.source.json dist/tessivum.rb --clobber
