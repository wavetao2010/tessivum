name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Tessivum release tag
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  web:
    name: Build Browser assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .release/deepseek-harness

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
      - name: Install pinned DeepSeek build dependencies
        working-directory: .release/deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Build pinned Cordis runtime
        working-directory: .release/deepseek-harness
        run: |
          pnpm run build:lib:host
          tar -czf "$GITHUB_WORKSPACE/cordis-runtime.tar.gz" \
            vendor/cordis/lib vendor/cosmokit/lib vendor/loader/lib

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cordis-runtime
          path: cordis-runtime.tar.gz
          if-no-files-found: error


      - name: Fetch verified Host-only modules
        run: python3 scripts/fetch_host_modules.py packaging/host-modules.json .release/host-modules

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: host-modules
          path: .release/host-modules
          if-no-files-found: error

      - name: Build Browser bundle
        working-directory: web
        env:
          CORDIS_VENDOR_ROOT: ${{ github.workspace }}/.release/deepseek-harness/vendor
          TESSIVUM_DEEPSEEK_SOURCE: ${{ github.workspace }}/.release/deepseek-harness
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-assets
          path: |
            web/dist
            web/client-packages
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wavetao2010/tessivum-core
          ref: e894744e88cbed359179745e31eed00c1f45201b
          path: .release/tessivum-core

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .release/deepseek-harness
          sparse-checkout: |
            vendor
            apps/cli/config/agent-presets

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-assets
          path: web

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: cordis-runtime
          path: .release


      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: host-modules
          path: .release/host-modules
      - name: Restore compiled Cordis runtime
        run: tar -xzf .release/cordis-runtime.tar.gz -C .release/deepseek-harness

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release executable
        env:
          CORDIS_VENDOR_ROOT: ${{ github.workspace }}/.release/deepseek-harness/vendor
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          scripts/package_release.sh \
            "$RELEASE_TAG" \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/tessivum" \
            ".release/tessivum-core/node/compat-host" \
            ".release/host-modules" \
            ".release/deepseek-harness/vendor" \
            ".release/deepseek-harness/apps/cli/config/agent-presets" \
            dist
          mkdir smoke
          tar -xzf "dist/tessivum-${RELEASE_TAG#v}-${{ matrix.target }}.tar.gz" -C smoke
          "smoke/tessivum-${RELEASE_TAG#v}-${{ matrix.target }}/bin/tessivum" --version
          launcher="smoke/tessivum-${RELEASE_TAG#v}-${{ matrix.target }}/bin/tessivum"
          "$launcher" --data-dir "$PWD/smoke-state" plugin add "file:$PWD/fixtures/community/timer"
          log="$PWD/smoke-web.log"
          TESSIVUM_WEB_ADDR=127.0.0.1:38080 \
            "$launcher" --data-dir "$PWD/smoke-state" web >"$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..100}; do
            if curl -fsS http://127.0.0.1:38080/ >/dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if [[ $ready != true ]]; then
            cat "$log"
            exit 1
          fi
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-preset-smoke","method":"agentPreset.list","payload":{}}' \
            http://127.0.0.1:38080/api/agentPreset.list \
            | jq -e '.result.ok == true and (.result.value.presets | map(.id)) == ["standard", "code", "minimal", "cordis"]'
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"release-plugin-smoke","method":"pluginInventory/list","payload":{"args":[]}}' \
            http://127.0.0.1:38080/api/pluginInventory/list \
            | jq -e '.result.ok == true and any(.result.value.entries[]; .moduleName == "@cordisjs/plugin-timer" and .enabled == true and .fiberPhase == "active")'
          kill "$server_pid"
          wait "$server_pid"
          trap - EXIT

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tessivum-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: tessivum-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: |
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Run installer and Formula fixture checks
        run: |
          sh scripts/test_install.sh
          python3 scripts/test_homebrew_formula.py

      - name: Generate and validate Homebrew Formula against local release archives
        run: python3 scripts/generate_homebrew_formula.py "$RELEASE_TAG" dist dist/tessivum.rb

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --title "Tessivum ${RELEASE_TAG#v}" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 dist/tessivum.rb --clobber
