[advisories]
ignore = [
    { id = "RUSTSEC-2026-0222", reason = "Latest Extism pins vulnerable Wasmtime 43; remove when Extism supports a patched Wasmtime. The host does not mix Wasmtime Store/type handles across engines." },
    { id = "RUSTSEC-2026-0247", reason = "Transitive through wasm-compose via latest Extism/Wasmtime; no patched release exists. Remove when upstream replaces it." },
    { id = "RUSTSEC-2026-0250", reason = "Transitive through wasm-compose via latest Extism/Wasmtime; no patched release exists. Remove when upstream replaces it." },
    { id = "RUSTSEC-2026-0251", reason = "Transitive through wasm-compose via latest Extism/Wasmtime; no patched release exists. Remove when upstream replaces it." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/wavetao2010/tessivum-core.git"]
